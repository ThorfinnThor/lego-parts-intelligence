version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # typescript-eslint 8.x explicitly rejects the TypeScript 7 API.
      # Remove this once the supported parser release is available.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
    groups:
      development-tooling:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
