name: Production release

on:
  workflow_dispatch:
    inputs:
      confirm_legal_approval:
        description: Type APPROVED after operator/legal source review
        required: true
        type: string
      confirm_sol_review:
        description: Type SOL_REVIEW_COMPLETE after the required release audit
        required: true
        type: string
      asset_tier:
        description: Cloudflare static asset tier
        required: true
        type: choice
        options: [paid, free]
        default: paid

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    if: inputs.confirm_legal_approval == 'APPROVED' && inputs.confirm_sol_review == 'SOL_REVIEW_COMPLETE'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      APP_BASE_URL: ${{ vars.APP_BASE_URL }}
      CLOUDFLARE_ASSET_TIER: ${{ inputs.asset_tier }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PRODUCTION_RELEASE: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - name: Archive deterministic launch-cohort audit
        uses: actions/upload-artifact@v5
        with:
          name: launch-cohort-${{ github.sha }}
          path: artifacts/launch-cohort/
          if-no-files-found: error
          retention-days: 90
      - name: Deploy one immutable asset version
        run: pnpm exec wrangler deploy
