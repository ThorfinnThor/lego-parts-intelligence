name: Source snapshot

on:
  workflow_dispatch:
    inputs:
      snapshot_id:
        description: Stable snapshot ID, for example rebrickable-2026-08-31
        required: true
        type: string
      confirm_source_review:
        description: Type APPROVED after reviewing the current source terms and URLs
        required: true
        type: string
      colors_url:
        description: Approved colors.csv or colors.csv.gz URL
        required: true
        type: string
      part_categories_url:
        description: Approved part_categories.csv or .csv.gz URL
        required: true
        type: string
      themes_url:
        description: Approved themes.csv or themes.csv.gz URL
        required: true
        type: string
      parts_url:
        description: Approved parts.csv or parts.csv.gz URL
        required: true
        type: string
      sets_url:
        description: Approved sets.csv or sets.csv.gz URL
        required: true
        type: string
      inventories_url:
        description: Approved inventories.csv or inventories.csv.gz URL
        required: true
        type: string
      inventory_parts_url:
        description: Approved inventory_parts.csv or .csv.gz URL
        required: true
        type: string
      part_relationships_url:
        description: Approved part_relationships.csv or .csv.gz URL
        required: true
        type: string

permissions:
  contents: read

jobs:
  snapshot:
    if: inputs.confirm_source_review == 'APPROVED'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SNAPSHOT_ID: ${{ inputs.snapshot_id }}
      COLORS_URL: ${{ inputs.colors_url }}
      PART_CATEGORIES_URL: ${{ inputs.part_categories_url }}
      THEMES_URL: ${{ inputs.themes_url }}
      PARTS_URL: ${{ inputs.parts_url }}
      SETS_URL: ${{ inputs.sets_url }}
      INVENTORIES_URL: ${{ inputs.inventories_url }}
      INVENTORY_PARTS_URL: ${{ inputs.inventory_parts_url }}
      PART_RELATIONSHIPS_URL: ${{ inputs.part_relationships_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.22.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate snapshot identifier
        shell: bash
        run: |
          if [[ ! "$SNAPSHOT_ID" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "snapshot_id may contain only letters, numbers, dots, underscores, and dashes."
            exit 1
          fi
      - name: Stream, decompress, and checksum complete approved source
        shell: bash
        run: |
          snapshot_dir="work/source-snapshots/$SNAPSHOT_ID"
          pnpm data:download -- --url="$COLORS_URL" --name=colors.csv --snapshot-dir="$snapshot_dir"
          pnpm data:download -- --url="$PART_CATEGORIES_URL" --name=part_categories.csv --snapshot-dir="$snapshot_dir"
          pnpm data:download -- --url="$THEMES_URL" --name=themes.csv --snapshot-dir="$snapshot_dir"
          pnpm data:download -- --url="$PARTS_URL" --name=parts.csv --snapshot-dir="$snapshot_dir"
          pnpm data:download -- --url="$SETS_URL" --name=sets.csv --snapshot-dir="$snapshot_dir"
          pnpm data:download -- --url="$INVENTORIES_URL" --name=inventories.csv --snapshot-dir="$snapshot_dir"
          pnpm data:download -- --url="$INVENTORY_PARTS_URL" --name=inventory_parts.csv --snapshot-dir="$snapshot_dir"
          pnpm data:download -- --url="$PART_RELATIONSHIPS_URL" --name=part_relationships.csv --snapshot-dir="$snapshot_dir"
          SOURCE_SNAPSHOT_DIR="$snapshot_dir" pnpm data:validate
          SOURCE_SNAPSHOT_DIR="$snapshot_dir" pnpm data:build
      - uses: actions/upload-artifact@v7
        with:
          name: source-snapshot-${{ inputs.snapshot_id }}-${{ github.run_id }}
          path: work/source-snapshots/${{ inputs.snapshot_id }}/
          if-no-files-found: error
          retention-days: 14
